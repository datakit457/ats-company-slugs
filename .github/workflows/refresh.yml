name: weekly refresh
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python refresh.py
      - run: |
          git config user.name "datakit457"
          git config user.email "datakit457@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Weekly refresh $(date -u +%F)"
          git push
